name: thmanyah-assessment
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: broadcast
      POSTGRES_DB: broadcast
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [db_data:/var/lib/postgresql/data]
    networks: [data]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 150
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U broadcast -d broadcast"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &logs
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  backend:
    build: ./app
    environment:
      DB_HOST: db
      DB_USER: broadcast
      DB_NAME: broadcast
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    networks: [web, data]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 80
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    logging: *logs
  frontend:
    build: ./nginx
    ports: ['127.0.0.1:8080:80']
    networks: [web]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 50
    logging: *logs
networks:
  web: {}
  data: {internal: true}
volumes:
  db_data: {}
secrets:
  db_password:
    file: ./secrets/db_password.txt
