name: thmanyah-s3
services:
  moto:
    image: motoserver/moto:5.1.18
    environment: {MOTO_PORT: '5000'}
    ports: ['127.0.0.1:5000:5000']
    networks: [s3]
    mem_limit: 512m
  s3-worker:
    build: ./s3
    environment:
      S3_ENDPOINT: http://moto:5000
      AWS_ACCESS_KEY_ID: local-emulator-only
      AWS_SECRET_ACCESS_KEY: local-emulator-only
      AWS_DEFAULT_REGION: us-east-1
      PART_MIB: '5'
    networks: [s3]
    depends_on: [moto]
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
  nodered:
    image: nodered/node-red:4.1.1
    ports: ['127.0.0.1:1880:1880']
    volumes: ['./s3/flows.json:/data/flows.json:ro']
    networks: [s3]
    depends_on: [s3-worker]
    mem_limit: 256m
    cpus: 0.5
networks:
  s3: {}
